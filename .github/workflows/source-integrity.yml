name: Source integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check source without installing dependencies
        run: node scripts/check-source-integrity.mjs
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
